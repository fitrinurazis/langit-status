# Halaman status Langit Panel (Upptime): https://status.langitpanel.com
# Dicek GitHub Actions tiap 5 menit, terpisah dari server Langit Panel (jaringan independen).
owner: fitrinurazis
repo: langit-status

sites:
  - name: Website
    url: https://langitpanel.com
  - name: Dashboard
    url: https://dashboard.langitpanel.com
  - name: API Panel
    url: https://apilangitpanel.fitrinurazis.com/health
  # Subdomain tanpa app → halaman fallback 503 = tunnel & router App Hosting hidup.
  - name: Jaringan App Hosting
    url: https://status-probe.seaone.id
    expectedStatusCodes:
      - 503
  # Pintu masuk trafik semua Server VPS (edge openresty).
  - name: Gateway Server VPS
    check: "tcp-ping"
    url: 202.10.45.61
    port: 443

status-website:
  cname: status.langitpanel.com
  name: Status Langit Panel
  logoUrl: https://langitpanel.com/icon_192.png
  favicon: https://langitpanel.com/favicon_32.png
  introTitle: "Status layanan Langit Panel"
  introMessage: "Pemantauan otomatis tiap 5 menit dari luar jaringan kami. Kalau ada gangguan, hubungi kami lewat WhatsApp dari langitpanel.com."
  navbar:
    - title: Langit Panel
      href: https://langitpanel.com
    - title: Dashboard
      href: https://dashboard.langitpanel.com
    - title: Panduan
      href: https://dashboard.langitpanel.com/docs

